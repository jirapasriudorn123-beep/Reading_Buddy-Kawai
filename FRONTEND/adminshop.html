<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Dashboard</title>
    <link rel="stylesheet" href="adminstyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet"> 
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="profile-area">
            <div class="avatar-circle">
                <img src="img/NEW_LOGO.png" alt="puppy" width="200" height="150">
            </div>
        </div>
        <nav class="menu">
            <a href="adminhome.html" class="menu-item">
                <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 1 9-9"/><path d="M12 12l4-4"/><circle cx="12" cy="12" r="1"/></svg></span>
                <span class="menu-label">หน้าหลัก</span>
            </a>
            <a href="adminlession.html" class="menu-item">
                <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="2.3"/><path d="M8 13a4 4 0 0 1 8 0"/><rect x="4" y="17" width="16" height="2.5" rx="1"/><path d="M6 17v-3a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v3"/></svg></span>
                <span class="menu-label">จัดการบทเรียน</span>
            </a>
            <a href="adminchat.html" class="menu-item">
                <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4L3 21l1.1-4.2A8.4 8.4 0 1 1 21 11.5z"/><circle cx="8.5" cy="11.5" r="1"/><circle cx="12" cy="11.5" r="1"/><circle cx="15.5" cy="11.5" r="1"/></svg></span>
                <span class="menu-label">จัดการแชทบอท</span>
            </a>
            <a href="adminshop.html" class="menu-item active">
                <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8V6a6 6 0 0 1 12 0v2"/><rect x="3" y="8" width="18" height="13" rx="2"/></svg></span>
                <span class="menu-label">จัดการร้านค้า</span>
            </a>
            <a href="admingame.html" class="menu-item">
                <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="6"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="15" cy="13" r="1"/><circle cx="18" cy="11" r="1"/></svg></span>
                <span class="menu-label">จัดการมินิเกม</span>
            </a>
            <a href="adminscore.html" class="menu-item">
                <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
                <span class="menu-label">จัดการคะแนน</span>
            </a>
            <a href="adminuser.html" class="menu-item">
                <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M6.5 19a6 6 0 0 1 11 0"/></svg></span>
                <span class="menu-label">จัดการผู้ใช้</span>
            </a>
        </nav>
        <div class="bottom-menu">
            <a href="#" class="menu-item" id="logoutBtn">
                <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
                <span class="menu-label">ลงชื่อออก</span>
            </a>
        </div>
        <button class="toggle-btn" id="toggleBtn">
            <span class="arrow-icon">◀</span>
        </button>
    </aside>

    <main class="main-content">
        <header class="header-action">
            <h2>จัดการร้านค้า</h2>
            <button id="openAddProductBtn" class="add-btn" onclick="openAddModal()">+ เพิ่มสินค้า</button>
        </header>

        <div class="filter-container">
            <div class="category-tabs">
                <button class="tab-btn active" onclick="filterItems('ทั้งหมด')">ทั้งหมด</button>
                <button class="tab-btn" onclick="filterItems('อาหาร')">อาหาร</button>
                <button class="tab-btn" onclick="filterItems('ของเล่น')">ของเล่น</button>
                <button class="tab-btn" onclick="filterItems('อาบน้ำ')">อาบน้ำ</button>
                <button class="tab-btn" onclick="filterItems('เสื้อผ้า')">เสื้อผ้า</button>
                <button class="tab-btn" onclick="filterItems('สัตว์เลี้ยง')">สัตว์เลี้ยง</button>
                <button class="tab-btn" onclick="filterItems('คูปอง')">คูปอง</button>
            </div>
            <div class="search-section">
                <input type="text" id="searchInput" oninput="searchProduct()" placeholder="ค้นหา...">
                <div class="cart-icon-container" onclick="openCart()">
                </div>
            </div>
        </div>

        <div class="shop-container">
            <div id="productGrid" class="product-grid"></div>
        </div>

        <!-- ✏️ Edit Modal (เพิ่มใหม่) -->
        <div id="editItemModal" class="edit-overlay">
            <div class="edit-modal-box">
                <div class="edit-modal-header">
                    <button class="edit-modal-back" onclick="closeEditModal()">&#8592;</button>
                    <span class="edit-modal-title">แก้ไข</span>
                </div>

                <input type="hidden" id="editItemId"/>

                <div class="edit-form-group">
                    <label class="edit-form-label" for="editItemName">ชื่อไอเทม :</label>
                    <input class="edit-form-input" id="editItemName" type="text" placeholder="ชื่อไอเทม"/>
                </div>

                <div class="edit-form-group">
                    <label class="edit-form-label" for="editItemDesc">คำอธิบายไอเทม :</label>
                    <textarea class="edit-form-textarea" id="editItemDesc" placeholder="คำอธิบาย..."></textarea>
                </div>

                <div class="edit-form-group">
                    <label class="edit-form-label" for="editItemCategory">หมวดหมู่ :</label>
                    <select class="edit-form-input" id="editItemCategory">
                        <option value="อาหาร">อาหาร</option>
                        <option value="ของเล่น">ของเล่น</option>
                        <option value="อาบน้ำ">อาบน้ำ</option>
                        <option value="เสื้อผ้า">เสื้อผ้า</option>
                        <option value="สัตว์เลี้ยง">สัตว์เลี้ยง</option>
                        <option value="คูปอง">คูปอง</option>
                    </select>
                </div>

                <div class="edit-form-row">
                    <div class="edit-form-group">
                        <label class="edit-form-label" for="editItemPetAction">ใช้กับน้องหมา :</label>
                        <select class="edit-form-input" id="editItemPetAction" onchange="togglePetGainField()">
                            <option value="">ใช้ไม่ได้ (ของสะสม)</option>
                            <option value="feed">🍽️ ให้อาหาร — เติมความอิ่ม</option>
                            <option value="bath">🛁 อาบน้ำ — เติมความสะอาด</option>
                            <option value="happiness">😊 เล่นด้วย — เติมความสุข</option>
                            <option value="sleep">😴 พักผ่อน — เติมพลังงาน</option>
                        </select>
                    </div>
                    <div class="edit-form-group" id="petGainGroup">
                        <label class="edit-form-label" for="editItemStatGain">เติมให้กี่ % :</label>
                        <input class="edit-form-input" id="editItemStatGain" type="number" min="1" max="100" placeholder="10"/>
                        <p class="edit-form-hint">ไอเทมนี้จะไปอยู่ในกระเป๋าที่เลือก และเติมสถานะให้ตามค่านี้</p>
                    </div>
                </div>

                <div class="edit-form-row">
                    <div class="edit-form-group">
                        <label class="edit-form-label" for="editItemPrice">ราคาไอเทม :</label>
                        <input class="edit-form-input" id="editItemPrice" type="number" min="0" placeholder="0"/>
                    </div>
                    <div class="edit-form-group">
                        <label class="edit-form-label">รูปไอเทม :</label>
                        <div class="edit-img-upload-area">
                            <img id="editImgPreview" src="" alt="preview"/>
                            <label class="edit-upload-label" for="editFileInput">
                                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                    <polyline points="17 8 12 3 7 8"/>
                                    <line x1="12" y1="3" x2="12" y2="15"/>
                                </svg>
                                <span id="editFileName">เลือกรูป...</span>
                            </label>
                            <input type="file" id="editFileInput" accept="image/*" onchange="handleEditFileSelect(event)"/>
                        </div>
                    </div>
                </div>

                <button class="edit-confirm-btn" onclick="saveItemEdit()">ยืนยัน</button>
            </div>
        </div>

    </main>
</div>

<script src="config.js"></script>
<script src="adminAuth.js"></script>
<script src="adminshop.js"></script>
</body>
</html>
