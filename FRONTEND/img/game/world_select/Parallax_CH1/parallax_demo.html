  #hint {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    color: #fff;
    background: rgba(0,0,0,0.35);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    letter-spacing: 0.3px;
    pointer-events: none;
    backdrop-filter: blur(2px);
  }

  #modeBtn {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 10;
    background: rgba(0,0,0,0.45);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.4);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
  }
  #modeBtn:hover { background: rgba(0,0,0,0.65); }

  #scrollTrack {
    position: absolute;
    inset: 0;
    overflow-y: scroll;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
  }
  #scrollTrack.active { pointer-events: auto; opacity: 1; }
  #scrollSpacer { height: 400vh; width: 1px; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="l1"></div>
  <div class="layer" id="l2"></div>
  <div class="layer" id="l3"></div>
  <div class="layer" id="l4"></div>
  <div class="layer" id="l5"></div>
  <div id="hint">ขยับเมาส์เพื่อดูเอฟเฟกต์พาราแล็กซ์ · กดปุ่มมุมขวาบนเพื่อสลับเป็นโหมดเลื่อน (scroll)</div>
  <button id="modeBtn">โหมด: เมาส์</button>
  <div id="scrollTrack"><div id="scrollSpacer"></div></div>
</div>

<script>
const layers = [
  { el: document.getElementById('l1'), speed: 0.02 }, // sky - slowest
  { el: document.getElementById('l2'), speed: 0.05 }, // mountains
  { el: document.getElementById('l3'), speed: 0.10 }, // campus midground
  { el: document.getElementById('l4'), speed: 0.18 }, // fence
  { el: document.getElementById('l5'), speed: 0.28 }, // foreground - fastest
];

let mode = 'mouse'; // 'mouse' or 'scroll'
const modeBtn = document.getElementById('modeBtn');
const hint = document.getElementById('hint');
const scrollTrack = document.getElementById('scrollTrack');
const stage = document.getElementById('stage');

let targetX = 0, targetY = 0, curX = 0, curY = 0;

function onMouseMove(e) {
  if (mode !== 'mouse') return;
  const rect = stage.getBoundingClientRect();
  const nx = (e.clientX - rect.left) / rect.width - 0.5; // -0.5..0.5
  const ny = (e.clientY - rect.top) / rect.height - 0.5;
  targetX = nx;
  targetY = ny;
}
stage.addEventListener('mousemove', onMouseMove);
stage.addEventListener('mouseleave', () => { targetX = 0; targetY = 0; });

function animate() {
  curX += (targetX - curX) * 0.06;
  curY += (targetY - curY) * 0.06;
  if (mode === 'mouse') {
    layers.forEach(({el, speed}) => {
      const px = -curX * speed * 400;
      const py = -curY * speed * 120;
      el.style.transform = `translate(calc(-50% + ${px}px), calc(-50% + ${py}px))`;
    });
  }
  requestAnimationFrame(animate);
}
animate();

function onScroll() {
  if (mode !== 'scroll') return;
  const st = scrollTrack.scrollTop;
  layers.forEach(({el, speed}) => {
    const px = -st * speed * 0.6;
    el.style.transform = `translate(-50%, calc(-50% - ${px}px))`;
  });
}
scrollTrack.addEventListener('scroll', onScroll);

modeBtn.addEventListener('click', () => {
  if (mode === 'mouse') {
    mode = 'scroll';
    modeBtn.textContent = 'โหมด: เลื่อน (scroll)';
    hint.textContent = 'เลื่อนล้อเมาส์ / แตะลาก เพื่อดูเอฟเฟกต์พาราแล็กซ์ · กดปุ่มเพื่อสลับกลับ';
    scrollTrack.classList.add('active');
    layers.forEach(({el}) => { el.style.transform = 'translate(-50%, -50%)'; });
  } else {
    mode = 'mouse';
    modeBtn.textContent = 'โหมด: เมาส์';
    hint.textContent = 'ขยับเมาส์เพื่อดูเอฟเฟกต์พาราแล็กซ์ · กดปุ่มมุมขวาบนเพื่อสลับเป็นโหมดเลื่อน (scroll)';
    scrollTrack.classList.remove('active');
    scrollTrack.scrollTop = 0;
    layers.forEach(({el}) => { el.style.transform = 'translate(-50%, -50%)'; });
  }
});
</script>
</body>
</html>
