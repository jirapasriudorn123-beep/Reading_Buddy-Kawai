<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>login</title>
  <link rel="stylesheet" href="style.css">

    <style>
      .box {
        width: 500px;
        height: 500px;
        background-image: url('img/logo_dogeyes.gif');
        background-size: cover;
        background-position: 35% top, 40% top;
      }
    </style>

    <link rel="stylesheet" href="cursor.css">
</head>
<body>

<div class="container">

  <div class="left">
    <div class="box"></div>
  </div> 
 
  <div class="right">
    <div class="card">
            <div class="gentle-glow"></div>
            <h1 class="comfort-title">Knowledge Starts here</h1>
                <p class="gentle-subtitle">Login</p>

      <form class="comfort-form" id="loginForm" novalidate>
                <div class="soft-field">
                    <div class="field-container">
                        <input type="email" placeholder=" " id="email" name="email" required autocomplete="email">
                        <label for="email">Email address</label>
                        <div class="field-accent"></div>
                    </div>
                    <span class="gentle-error" id="emailError"></span>
                </div>

                <div class="soft-field">
                    <div class="field-container">
                        <input type="password" placeholder=" " id="password" name="password" required autocomplete="current-password">
                        <label for="password">Password</label>
                        <button type="button" class="gentle-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                            <div class="toggle-icon"> 
                                <svg class="eye-open" width="1150" height="20" viewBox="0 0 20 20" fill="none">
                                    <path d="M10 3c-4.5 0-8.3 3.8-9 7 .7 3.2 4.5 7 9 7s8.3-3.8 9-7c-.7-3.2-4.5-7-9-7z" stroke="currentColor" stroke-width="1.5" fill="none"/>
                                    <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5" fill="none"/>
                                </svg>
                                <svg class="eye-closed" width="1150" height="20" viewBox="0 0 20 20" fill="none">
                                    <path d="M3 3l14 14M8.5 8.5a3 3 0 004 4m2.5-2.5C15 10 12.5 7 10 7c-.5 0-1 .1-1.5.3M10 13c-2.5 0-4.5-2-5-3 .3-.6.7-1.2 1.2-1.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                        </button>
                        <div class="field-accent"></div>
                    </div>
                    <span class="gentle-error" id="passwordError"></span>
                </div>

                <div class="comfort-options">
                    <label class="gentle-checkbox">
                        <input type="checkbox" id="remember" name="remember">
                        <span class="checkbox-soft">
                            <div class="check-circle"></div>
                            <svg class="check-mark" width="12" height="10" viewBox="0 0 12 10" fill="none">
                                <path d="M1 5l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                        <span class="checkbox-text">Remember me</span>
                    </label>
                    <a href="forgot.html" class="comfort-link">Forgot password?</a>
                </div>

                <button type="submit" class="comfort-button" id="submitBtn">
                    <div class="button-background"></div>
                    <span class="button-text">Sign in</span>
                    <div class="button-loader">
                        <div class="gentle-spinner">
                            <div class="spinner-circle"></div>
                        </div>
                    </div>
                    <div class="button-glow"></div>
                </button>
            </form>
            
                <div class="comfort-signup">
                <span class="signup-text">Don't have an account?</span>
                <a href="register.html" class="comfort-link signup-link">Sign up</a>
    </div>
  </div>

</div>

<script src="config.js"></script>
<script>
const form = document.getElementById("loginForm");
const submitBtn = document.getElementById("submitBtn");
const emailError = document.getElementById("emailError");
const passwordError = document.getElementById("passwordError");

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  emailError.textContent = "";
  passwordError.textContent = "";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  submitBtn.classList.add("loading");
  submitBtn.disabled = true;

  try {
    const response = await fetch(`${API_BASE_URL}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });

    const data = await response.json();

    if (!response.ok) {
      passwordError.textContent = data.message || "เข้าสู่ระบบไม่สำเร็จ";
      return;
    }

    localStorage.setItem("token", data.token);
    localStorage.setItem("currentUser", data.user.username);

    window.location.href = "index.html";
  } catch (err) {
    console.error("Login request failed:", err);
    passwordError.textContent = "เชื่อมต่อ server ไม่ได้ กรุณาลองใหม่อีกครั้ง";
  } finally {
    submitBtn.classList.remove("loading");
    submitBtn.disabled = false;
  }
});

document.getElementById("passwordToggle").onclick = function () {
  const input = document.getElementById("password");
  input.type = input.type === "password" ? "text" : "password";
};
</script>
    <script src="cursor.js"></script>
</body>
</html>
