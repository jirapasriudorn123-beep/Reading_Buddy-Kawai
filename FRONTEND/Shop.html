<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cursor.css">
    <link rel="stylesheet" href="notifications.css">
</head>
<body>
    <div class="container">
    <aside class="sidebar">
        <div class="profile-area">
            <div class="avatar-circle">
                <img src="img/NEW_LOGO.png" alt="รูปโปรไฟล์">
            </div>
        </div>

        <nav class="menu">
            <a href="index.html" class="menu-item">
                <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
                <span class="menu-label">หน้าหลัก</span>
            </a>
            <a href="Pet.html" class="menu-item">
                <span class="menu-icon"><svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="17" rx="5" ry="4"/><ellipse cx="4.5" cy="10" rx="2.2" ry="3"/><ellipse cx="19.5" cy="10" rx="2.2" ry="3"/><ellipse cx="8.5" cy="5.5" rx="2" ry="2.8"/><ellipse cx="15.5" cy="5.5" rx="2" ry="2.8"/></svg></span>
                <span class="menu-label">สัตว์เลี้ยง</span>
            </a>
            <a href="Shop.html" class="menu-item active">
                <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8V6a6 6 0 0 1 12 0v2"/><rect x="3" y="8" width="18" height="13" rx="2"/></svg></span>
                <span class="menu-label">ร้านค้า</span>
            </a>
            <a href="Dashboard.html" class="menu-item">
                <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 1 9-9"/><path d="M12 12l4-4"/><circle cx="12" cy="12" r="1"/></svg></span>
                <span class="menu-label">แดชบอร์ด</span>
            </a>
        </nav>

        <div class="bottom-menu">
            <a href="setting.html" class="menu-item">
                <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
                <span class="menu-label">ตั้งค่า</span>
            </a>
            <a href="#" class="menu-item" id="logoutBtn">
                <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
                <span class="menu-label">ลงชื่อออก</span>
            </a>
        </div>
        <button class="toggle-btn" id="toggleBtn">
        <span class="arrow-icon">◀</span>
    </button>
    </aside>
    <main class="main-content">
<header class="top-nav">
     <h2>Shop</h2>
        <div class="user-stats">
            <div class="coin-pill">
                <img src="img/coin_ja.png" alt="เหรียญ" class="coin-icon-img">
                <span class="coin-amount-badge" id="coinAmount">...</span>
            </div>
            <div class="noti-icon-wrap">
                <img src="img/bell-icon.png" alt="แจ้งเตือน" class="noti-icon-img">
                <span class="noti-badge">1</span>
            </div>
            <div id="themeToggleSlot"></div>
        </div>
    </header>
<div class="filter-container">
    <div class="category-tabs">
        <button class="tab-btn active" onclick="filterItems('ทั้งหมด')">ทั้งหมด</button>
        <button class="tab-btn" onclick="filterItems('อาหาร')">อาหาร</button>
        <button class="tab-btn" onclick="filterItems('ของเล่น')">ของเล่น</button>
        <button class="tab-btn" onclick="filterItems('อาบน้ำ')">อาบน้ำ</button>
        <button class="tab-btn" onclick="filterItems('เสื้อผ้า')">เสื้อผ้า</button>
        <button class="tab-btn" onclick="filterItems('สัตว์เลี้ยง')">สัตว์เลี้ยง</button>
        <button class="tab-btn" onclick="filterItems('คูปอง')">คูปอง</button>
    </div>

<div class="search-section">
    <input type="text" id="searchInput" oninput="searchProduct()" placeholder="ค้นหา..." 
           style="margin-left: 60px; width: calc(100% - 60px);">

    <div class="cart-icon-container" onclick="openCart()">
        <img src="img/cart-basket.png" alt="ตะกร้า" width="45">
        <span id="cartCount" class="cart-badge">0</span>
    </div>
</div>
</div>

<div class="shop-container">
    <div id="productGrid" class="product-grid">
        </div>
</div>

<div id="productModal" class="modal-overlay" onclick="closeModalOutside(event)">
    <div class="product-detail-content" onclick="event.stopPropagation()">
        <button class="close-x" onclick="closeModal('productModal')">x</button>

        <h3 id="modalName" class="product-title"></h3>

        <div class="detail-body">
            <div class="modal-img-side">
                <img id="modalImg" src="" alt="product">
            </div>
            <div class="modal-text-side">
                <p id="modalDesc" class="product-desc"></p>
            </div>
        </div>

        <div class="modal-footer">
            <div class="modal-qty-row">
                <span class="modal-qty-label">จำนวน :</span>
                <div class="modal-qty-control">
                    <button type="button" class="qty-btn" onclick="changeModalQty(-1)" aria-label="ลดจำนวน">-</button>
                    <input type="number" id="modalQty" value="1" min="1" max="99" oninput="onModalQtyInput()" aria-label="จำนวนที่ต้องการซื้อ">
                    <button type="button" class="qty-btn" onclick="changeModalQty(1)" aria-label="เพิ่มจำนวน">+</button>
                </div>
            </div>
            <div class="modal-action-btns">
                <button class="buy-now-btn" onclick="buyNow()">
                    <img src="img/coin_ja.png" width="18">
                    <span id="modalBuyPrice"></span>
                </button>
                <button class="add-to-cart-btn" onclick="addToCart()">
                    <img src="img/cart-basket2.png" width="20"> เพิ่มลงตะกร้า
                </button>
            </div>
        </div>
    </div>
</div>

<div id="cartModal" class="modal-overlay" onclick="closeCartOutside(event)">
    <div class="cart-modal-content" onclick="event.stopPropagation()">
        <div class="cart-header">
            <button class="back-link" onclick="closeModal('cartModal')">
                ← ตะกร้าของคุณ
            </button>
            <p id="cartCountTitle" class="item-count-text">0 ไอเทมอยู่ในตะกร้า</p>
        </div>

        <div id="cartItemList" class="cart-item-list">
            </div>

        <div class="cart-summary-section">
            <h4 class="summary-title">สรุปการชำระเงิน</h4>
            <div id="summaryList" class="summary-details">
                </div>
            <hr class="summary-divider">
            <div class="summary-total">
                <span>ทั้งหมด</span>
                <span id="totalCoins" class="total-amount">0</span>
            </div>
        </div>

        <button class="checkout-btn" onclick="checkout()">ซื้อ</button>
    </div>
</div>
<script src="config.js"></script>
<script src="notifications.js"></script>
<script src="shop.js"></script>
<script src="theme.js"></script>
<script src="chat.js"></script>
<script src="cursor.js"></script>
</body>
</html>
