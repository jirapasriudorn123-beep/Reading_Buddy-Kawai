<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>login</title>
  <link rel="stylesheet" href="style.css?v=20261025e">

    <style>
      /* หน้าเลือกพันธุ์: กล่องเลือกอยู่กลางจอ ขยายใหญ่ (ไม่ใช้ช่องซ้ายแบบหน้า login) */
      .select-pet-page .container { justify-content: center; align-items: center; height: auto; min-height: 100vh; }
      .select-pet-page .left { display: none; }
      .select-pet-page .right { flex: 0 1 auto; width: 100%; padding: 16px; box-sizing: border-box; }
      .select-pet-page .card:has(.selection-container) {
        width: min(920px, 100%);
        max-height: none;
        padding: 40px 36px 44px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      }
      .select-pet-page .selection-title { font-size: clamp(28px, 4vw, 40px); margin: 0 0 8px; }
      /* จอกว้าง: 4 พันธุ์เรียงแถวเดียว | จอแคบ: ตาราง 2x2 (ไม่ให้เหลือ 3+1) */
      .select-pet-page .pet-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 24px 0 28px; }
      .select-pet-page .pet-options .pet-card { width: auto; padding: 22px 14px; background: #fffdf8; }
      @media (max-width: 760px) {
        .select-pet-page .pet-options { grid-template-columns: repeat(2, minmax(0, 200px)); justify-content: center; gap: 14px; }
        .select-pet-page .card:has(.selection-container) { padding: 28px 18px 32px; }
      }
      .select-pet-page .pet-thumb img { width: clamp(84px, 11vw, 120px); height: clamp(84px, 11vw, 120px); }
      .select-pet-page .pet-card h3 { font-size: clamp(16px, 1.8vw, 20px); margin: 12px 0 0; }
      .select-pet-page .naming-section { margin-top: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .select-pet-page #petNameInput { width: min(420px, 100%); font-size: 20px; padding: 14px 20px; box-sizing: border-box; text-align: center; }
      .select-pet-page .confirm-btn { margin: 0; width: min(420px, 100%); font-size: 22px; padding: 14px 30px; }
    </style>

    <link rel="stylesheet" href="cursor.css?v=20260926">
</head>
<body class="select-pet-page">

<div class="container">

  <div class="left">
    <div class="box"></div>
  </div> 
 
  <div class="right">
    <div class="card">
        <div class="selection-container">
    <h1 class="selection-title">เลือกคู่หูของคุณ</h1>
    
    <div class="pet-options">
        <div class="pet-card" onclick="setBreed('golden')" id="card-golden">
            <div class="pet-thumb"><img src="img/game/Logo_golden.png" alt="โกลเด้น"></div>
            <h3>โกลเด้น</h3>
        </div>
        <div class="pet-card" onclick="setBreed('shiba')" id="card-shiba">
            <div class="pet-thumb"><img src="img/game/Logo_shiba.png" alt="ชิบะอินุ"></div>
            <h3>ชิบะอินุ</h3>
        </div>
        <div class="pet-card" onclick="setBreed('siberian')" id="card-siberian">
            <div class="pet-thumb"><img src="img/game/Logo_Siberian.png" alt="ไซบีเรียนฮัสกี้"></div>
            <h3>ไซบีเรียนฮัสกี้</h3>
        </div>
        <div class="pet-card" onclick="setBreed('thairidgeback')" id="card-thairidgeback">
            <div class="pet-thumb"><img src="img/game/Logo_thairidgeback.png" alt="ไทยหลังอาน"></div>
            <h3>ไทยหลังอาน</h3>
        </div>
    </div>

    <div class="naming-section">
        <input type="text" id="petNameInput" placeholder="ตั้งชื่อให้สัตว์เลี้ยงของคุณ..." maxlength="10">
        <button class="confirm-btn" onclick="saveAndStart()">เริ่มการเดินทาง!</button>
    </div>
</div>
    </div>
  </div>
<script src="config.js?v=20261024b"></script><script src="pet.js?v=20261021c"></script>
    <script src="cursor.js"></script>
<script src="click-sound.js?v=2"></script>
</body>
</html>
