<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>set new password</title>
  <link rel="stylesheet" href="style.css">

    <style>
      .box {
        width: 500px;
        height: 500px;
        background-image: url('img/NEW_LOGO.png');
        background-size: cover;
        background-position: center 40px;
      }
    </style>
    <link rel="stylesheet" href="cursor.css">
</head>
<body>

<div class="container">

  <div class="left">
    <div class="card">
      <div class="reset"></div>
            <h1 class="comfort-title">Set New Password</h1><br>

          <form class="comfort-form" id="newPasswordForm" novalidate>
                <div class="soft-field">
                    <div class="field-container">
                        <input type="password" id="newPassword" name="newPassword" required autocomplete="new-password" placeholder=" ">
                        <label for="newPassword">New Password</label>
                        <button type="button" class="gentle-toggle" id="newPasswordToggle" aria-label="Toggle password visibility">
                            <div class="toggle-icon">
                                <svg class="eye-open" width="1150" height="20" viewBox="0 0 20 20" fill="none">
                                    <path d="M10 3c-4.5 0-8.3 3.8-9 7 .7 3.2 4.5 7 9 7s8.3-3.8 9-7c-.7-3.2-4.5-7-9-7z" stroke="currentColor" stroke-width="1.5" fill="none"/>
                                    <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5" fill="none"/>
                                </svg>
                                <svg class="eye-closed" width="1150" height="20" viewBox="0 0 20 20" fill="none">
                                    <path d="M3 3l14 14M8.5 8.5a3 3 0 004 4m2.5-2.5C15 10 12.5 7 10 7c-.5 0-1 .1-1.5.3M10 13c-2.5 0-4.5-2-5-3 .3-.6.7-1.2 1.2-1.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                        </button>
                        <div class="field-accent"></div>
                    </div>
                    <span class="gentle-error" id="newPasswordError"></span>
                </div>

                <div class="soft-field">
                    <div class="field-container">
                        <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" placeholder=" ">
                        <label for="confirmPassword">Confirm New Password</label>
                        <button type="button" class="gentle-toggle" id="confirmPasswordToggle" aria-label="Toggle password visibility">
                            <div class="toggle-icon">
                                <svg class="eye-open" width="1150" height="20" viewBox="0 0 20 20" fill="none">
                                    <path d="M10 3c-4.5 0-8.3 3.8-9 7 .7 3.2 4.5 7 9 7s8.3-3.8 9-7c-.7-3.2-4.5-7-9-7z" stroke="currentColor" stroke-width="1.5" fill="none"/>
                                    <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5" fill="none"/>
                                </svg>
                                <svg class="eye-closed" width="1150" height="20" viewBox="0 0 20 20" fill="none">
                                    <path d="M3 3l14 14M8.5 8.5a3 3 0 004 4m2.5-2.5C15 10 12.5 7 10 7c-.5 0-1 .1-1.5.3M10 13c-2.5 0-4.5-2-5-3 .3-.6.7-1.2 1.2-1.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                        </button>
                        <div class="field-accent"></div>
                    </div>
                    <span class="gentle-error" id="confirmPasswordError"></span>
                </div>

                <button type="submit" class="comfort-button" id="submitBtn">
                    <div class="button-background"></div>
                    <span class="button-text">Set New Password</span>
                    <div class="button-loader">
                        <div class="gentle-spinner">
                            <div class="spinner-circle"></div>
                        </div>
                    </div>
                    <div class="button-glow"></div>
                </button>
            </form>
            <p class="gentle-error" id="topLevelError" style="display: none;"></p>
      <a href="login.html" class="comfort-link">Back to Login</a>
    </div>
  </div>

  <div class="right">
    <div class="box"></div>
  </div>
  </div>
</div>

<script src="config.js"></script>
<script>
const form = document.getElementById("newPasswordForm");
const submitBtn = document.getElementById("submitBtn");
const newPasswordError = document.getElementById("newPasswordError");
const confirmPasswordError = document.getElementById("confirmPasswordError");
const topLevelError = document.getElementById("topLevelError");

const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get("token");

if (!token) {
  form.style.display = "none";
  topLevelError.textContent = "ลิงก์ไม่ถูกต้อง กรุณาขอลิงก์รีเซ็ตรหัสผ่านใหม่อีกครั้ง";
  topLevelError.style.display = "block";
}

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  newPasswordError.textContent = "";
  confirmPasswordError.textContent = "";
  topLevelError.style.display = "none";

  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (newPassword.length < 6) {
    newPasswordError.textContent = "รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร";
    return;
  }
  if (newPassword !== confirmPassword) {
    confirmPasswordError.textContent = "รหัสผ่านไม่ตรงกัน";
    return;
  }

  submitBtn.classList.add("loading");
  submitBtn.disabled = true;

  try {
    const response = await fetch(`${API_BASE_URL}/auth/reset-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, newPassword, confirmPassword }),
    });

    const data = await response.json();

    if (!response.ok) {
      topLevelError.textContent = data.message || "ตั้งรหัสผ่านใหม่ไม่สำเร็จ";
      topLevelError.style.display = "block";
      return;
    }

    alert("ตั้งรหัสผ่านใหม่สำเร็จ! กรุณาเข้าสู่ระบบด้วยรหัสผ่านใหม่");
    window.location.href = "login.html";
  } catch (err) {
    console.error("Reset password request failed:", err);
    topLevelError.textContent = "เชื่อมต่อ server ไม่ได้ กรุณาลองใหม่อีกครั้ง";
    topLevelError.style.display = "block";
  } finally {
    submitBtn.classList.remove("loading");
    submitBtn.disabled = false;
  }
});

document.getElementById("newPasswordToggle").onclick = function () {
  const input = document.getElementById("newPassword");
  input.type = input.type === "password" ? "text" : "password";
};

document.getElementById("confirmPasswordToggle").onclick = function () {
  const input = document.getElementById("confirmPassword");
  input.type = input.type === "password" ? "text" : "password";
};
</script>
    <script src="cursor.js"></script>
</body>
</html>
