<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการมินิเกม — เกี่ยวกับสุนัข</title>
    <link rel="stylesheet" href="adminstyle.css?v=2">
    <link rel="stylesheet" href="admingame.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="profile-area">
            <div class="avatar-circle">
                <img src="img/NEW_LOGO.png" alt="puppy" width="200" height="150"> </div>
        </div>

        <nav class="menu">
            <a href="adminhome.html" class="menu-item">
                <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 1 9-9"/><path d="M12 12l4-4"/><circle cx="12" cy="12" r="1"/></svg></span>
                <span class="menu-label">หน้าหลัก</span>
            </a>
            <a href="adminlession.html" class="menu-item">
                <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="2.3"/><path d="M8 13a4 4 0 0 1 8 0"/><rect x="4" y="17" width="16" height="2.5" rx="1"/><path d="M6 17v-3a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v3"/></svg></span>
                <span class="menu-label">จัดการบทเรียน</span>
            </a>
            <a href="adminshop.html" class="menu-item">
                <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8V6a6 6 0 0 1 12 0v2"/><rect x="3" y="8" width="18" height="13" rx="2"/></svg></span>
                <span class="menu-label">จัดการร้านค้า</span>
            </a>
            <a href="admingame.html" class="menu-item active">
                <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="6"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="15" cy="13" r="1"/><circle cx="18" cy="11" r="1"/></svg></span>
                <span class="menu-label">จัดการมินิเกม</span>
            </a>
            <a href="adminscore.html" class="menu-item">
                <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
                <span class="menu-label">จัดการคะแนน</span>
            </a>
            <a href="adminuser.html" class="menu-item">
                <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M6.5 19a6 6 0 0 1 11 0"/></svg></span>
                <span class="menu-label">จัดการผู้ใช้</span>
            </a>
        </nav>

        <div class="bottom-menu">
            <a href="#" class="menu-item" id="logoutBtn">
                <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
                <span class="menu-label">ลงชื่อออก</span>
            </a>
        </div>
        <button class="toggle-btn" id="toggleBtn">
            <span class="arrow-icon">◀</span>
        </button>
    </aside>

    <main class="main-content">
        <header class="header-action" style="display:flex; align-items:center; justify-content:space-between;">
            <h2 style="display:flex; align-items:center; gap:12px;">
                <a href="admingame.html" style="text-decoration:none; color:#888; font-size:22px;">&#8592;</a>
                จัดการมินิเกม — เกี่ยวกับสุนัข
            </h2>
        </header>

        <div class="qe-toolbar">
            <div class="qe-toolbar-left">
                <!-- Dropdown สลับหมวด: กลับไปหน้ารายชื่อบท / อยู่หน้าเกี่ยวกับสุนัข -->
                <div class="qe-level-filter">
                    <select id="chapterNav" class="qe-level-select" onchange="onChapterNavChange(this.value)">
                        <option value="all">วิชาสถาปัตย์คอมฯ</option>
                        <option value="dogs">เกี่ยวกับสุนัข</option>
                    </select>
                </div>
                <!-- Dropdown เลือกพันธุ์สุนัข (คำถามด่าน 2, 4 ในเกม) -->
                <div class="qe-level-filter">
                    <select id="breedNav" class="qe-level-select" onchange="onBreedChange(this.value)">
                        <option value="golden">🦮 โกลเด้นรีทรีฟเวอร์</option>
                        <option value="shiba">🐕 ชิบะอินุ</option>
                        <option value="siberian">🐺 ไซบีเรียนฮัสกี้</option>
                        <option value="thairidgeback">🐶 ไทยหลังอาน</option>
                    </select>
                </div>
                <!-- Dropdown กรองตามด่าน (คำถามพันธุ์สุนัขใช้ได้เฉพาะด่าน 2, 4) -->
                <div class="qe-level-filter">
                    <select id="stageFilter" class="qe-level-select">
                        <option value="all">ด่านทั้งหมด</option>
                        <option value="2">ด่าน 2</option>
                        <option value="4">ด่าน 4</option>
                    </select>
                </div>
            </div>
            <button class="qe-add-btn" onclick="openAddQuestionModal()">
                <span class="qe-add-plus">+</span> เพิ่มคำถาม
            </button>
        </div>

        <div id="questionList" class="qe-question-list">
            <p style="color:#999; text-align:center; padding:40px;">กำลังโหลดคำถาม...</p>
        </div>
    </main>
</div>

<!-- Modal เพิ่ม/แก้ไข คำถาม -->
<div id="questionModal" class="edit-overlay">
    <div class="edit-modal-box" style="max-width:560px;">
        <div class="edit-modal-header">
            <button class="edit-modal-back" onclick="closeQuestionModal()">&#8592;</button>
            <span class="edit-modal-title" id="questionModalTitle">เพิ่มคำถาม</span>
        </div>

        <input type="hidden" id="editQuestionId">

        <div class="edit-form-group">
            <label class="edit-form-label" for="editQuestionStage">ด่านที่</label>
            <select class="edit-form-input" id="editQuestionStage">
                <option value="2">ด่าน 2</option>
                <option value="4">ด่าน 4</option>
            </select>
        </div>

        <div class="edit-form-group">
            <label class="edit-form-label" for="editQuestionText">คำถาม</label>
            <textarea class="edit-form-textarea" id="editQuestionText" placeholder="เช่น โกลเด้นรีทรีฟเวอร์มีถิ่นกำเนิดจากประเทศใด?"></textarea>
        </div>

        <div class="edit-form-group">
            <label class="edit-form-label">ตัวเลือกและคำตอบที่ถูก</label>
            <div class="qe-option-row">
                <input type="radio" name="correctOption" value="1" id="correctOpt1">
                <input class="edit-form-input qe-option-input" id="editOption1" placeholder="ตัวเลือก 1">
            </div>
            <div class="qe-option-row">
                <input type="radio" name="correctOption" value="2" id="correctOpt2">
                <input class="edit-form-input qe-option-input" id="editOption2" placeholder="ตัวเลือก 2">
            </div>
            <div class="qe-option-row">
                <input type="radio" name="correctOption" value="3" id="correctOpt3">
                <input class="edit-form-input qe-option-input" id="editOption3" placeholder="ตัวเลือก 3">
            </div>
            <div class="qe-option-row">
                <input type="radio" name="correctOption" value="4" id="correctOpt4">
                <input class="edit-form-input qe-option-input" id="editOption4" placeholder="ตัวเลือก 4">
            </div>
            <small style="color:#999;">ติ๊กหน้าตัวเลือกที่เป็นคำตอบที่ถูกต้อง</small>
        </div>

        <div class="edit-form-actions">
            <button class="edit-cancel-btn" onclick="closeQuestionModal()">ยกเลิก</button>
            <button class="edit-confirm-btn" onclick="saveQuestion()">บันทึก</button>
        </div>
    </div>
</div>

<script src="config.js?v=2"></script>
<script src="adminAuth.js?v=2"></script>
<script src="admingame-dogs.js?v=2"></script>
</body>
</html>
