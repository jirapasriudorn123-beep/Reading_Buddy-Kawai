     <main class="main-content">
<header class="top-nav">
     <h2>Dashboard</h2>

 <div class="user-stats">
        <div class="coin-pill">
            <img src="img/coin_ja.png" alt="เหรียญ" class="coin-icon-img">
            <span class="coin-amount-badge" id="coinAmount">...</span>
        </div>
        <div class="noti-icon-wrap">
            <img src="img/bell-icon.png" alt="แจ้งเตือน" class="noti-icon-img">
            <span class="noti-badge">1</span>
        </div>
        <div id="themeToggleSlot"></div>
    </div>
</header>
    <section class="goal-section">
        <h3>เป้าหมายการอ่านวันนี้</h3>
        <div class="progress-container">
    <div id="todayProgressBar" class="progress-bar" style="width: 0%;">0%</div>
        </div>
        <p id="progressDetail" style="font-family:'Kanit', sans-serif; color:#555; margin-top:8px;"></p>
    </section>

    <section class="chart-section">
        <h3>เปรียบเทียบ เวลาอ่าน vs เป้าหมาย</h3>
        <div class="chart-container">
            <h4 class="chart-inner-title">เวลาที่อ่าน (นาที)</h4>
            <div class="chart-legend">
                <span class="legend-item"><span class="legend-dot" style="background:#8db754"></span>เวลาที่อ่าน</span>
                <span class="legend-item"><span class="legend-dot" style="background:#f9e79f"></span>เป้าหมาย</span>
            </div>
            <canvas id="readingChart"></canvas>
        </div>
    </section>
    <div class="dashboard-container" style="padding: 20px;">
    <div class="chart-card">
        <h3>การจำแนกเวลาโฟกัส</h3>
        <canvas id="focusChart"></canvas>
    </div>

    <div class="chart-card" style="margin-top: 30px;">
        <h3>แนวโน้มการอ่าน</h3>
        <canvas id="trendChart"></canvas>
    </div>
</div>
</main>
</div>
